{% extends 'base.html' %}
{% block title %}Create Account | Loan Processing and Approval Platform{% endblock %}
{% block content %}
<div class="auth-layout register-layout">
  <section class="form-card register-card">
    <h2>Create account</h2>
    <form method="post" id="register-form">
      <label for="name">Full name</label>
      <input id="name" name="name" required maxlength="100" placeholder="Your full name">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email">

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" required maxlength="20" placeholder="Contact number" autocomplete="tel">

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" required placeholder="City, state" autocomplete="street-address"></textarea>

      <label for="password">Password (at least 8 characters)</label>
      <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Create a password">

      <button class="button primary full" type="submit">Create account</button>
    </form>
    <p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </section>
</div>
{% endblock %}
